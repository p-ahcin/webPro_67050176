<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade System</title>
    <!-- เชื่อมโยงไฟล์ CSS สำหรับตกแต่ง[cite: 2] -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>ระบบบันทึกคะแนนและตัดเกรด</h2>
        
        <!-- สร้างฟอร์มและกำหนด id เพื่อให้ JS อ้างอิงได้ -->
        <form id="gradeForm">
            <div class="form-group">
                <label>ชื่อนักศึกษา:</label>
                <!-- ช่องรับข้อความ (text)[cite: 1] -->
                <input type="text" id="studentName" placeholder="กรอกชื่อ" required>
            </div>
            
            <div class="form-group">
                <label>คะแนนสอบ (0-100):</label>
                <!-- ช่องรับตัวเลข -->
                <input type="number" id="studentScore" placeholder="กรอกคะแนน" min="0" max="100" required>
            </div>
            
            <button type="submit">คำนวณเกรด</button>
        </form>

        <hr>
        
        <!-- พื้นที่สำหรับแสดงผลลัพธ์ผ่าน JS[cite: 1] -->
        <div id="resultArea">
            <p>ผลลัพธ์จะแสดงที่นี่...</p>
        </div>
    </div>

    <!-- เชื่อมโยงไฟล์ JavaScript ไว้ก่อนปิด body เพื่อให้โหลด UI เสร็จก่อน[cite: 4] -->
    <script src="app.js"></script>
</body>
</html>
