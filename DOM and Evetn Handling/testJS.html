<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>JavaScript DOM & Event Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .highlight {
            background-color: #fff3cd;
            border-color: #ffeeba;
        }

        .text-danger {
            color: red;
        }
    </style>
</head>

<body>
    <h2>ฟอร์มลงทะเบียนสมาชิก (Registration Form)</h2>
    <form id="regForm">
        <div class="form-group">
            <label>ชื่อ-นามสกุล:</label>
            <input type="text" id="fullname" class="input-field" placeholder="กรอกชื่อ-นามสกุล">
            <span id="nameError" class="text-danger"></span>
        </div>
        <div class="form-group">
            <label>แผนก/สาขา:</label>
            <select id="department" class="input-field">
                <option value="">-- เลือกแผนก --</option>
                <option value="IT">เทคโนโลยีสารสนเทศ</option>
                <option value="MKT">การตลาด</option>
                <option value="HR">ทรัพยากรบุคคล</option>
            </select>
        </div>
        <div class="form-group">
            <label>ระดับประสบการณ์:</label><br>
            <input type="radio" name="level" value="Junior" class="user-level">Junior
            <input type="radio" name="level" value="Senior" class="user-level">Senior
        </div>
        <div class="form-group">
            <label>ทักษะความสามารถ(เลือกได้มากกว่า 1):</label><br>
            <input type="checkbox" name="skills" value="HTML/CSS"> HTML/CSS
            <input type="checkbox" name="skills" value="JavaScript">JavaScript
            <input type="checkbox" name="skills" value="Database"> Database
        </div>
        <div class="form-group">
            <label>โปรไฟล์รูปภาพ (URL):</label>
            <input type="text" id="avatarUrl" placeholder="วางลิงกร์ูปภาพที่นี่">
        </div>
        <button type="button" id="btnPreview">ดูตัวอย่างข้อมูล</button>
        <button type="submit" id="btnSubmit">ลงทะเบียน</button>
    </form>
    <hr>
    <h3>พื้นที่แสดงผล(Preview Area)</h3>
    <div id="previewCard" class="card">
        <img id="avatarImg" src="avatarImg.jpg" alt="Profile" width="100">
        <!-- <img id="avatarImg" src="https://via.placeholder.com/100" alt="Profile" width="100"> -->
        <h4 id="dispName">ชื่อ: -</h4>
        <p id="dispDept">แผนก: -</p>
        <p id="dispDetails">รายละเอียด: -</p>
    <div id="jsonResult"></div>
    </div>
    <script>
        // โค้ด JavaScript ในแต่ละขอ้จะถูกเขียนบริเวณนี้
        const btnPreview = document.getElementById('btnPreview');
        console.log(btnPreview);

        const className = document.getElementsByClassName('input-field');
        console.log(className);
        
        const firstRadioButton = document.querySelector('input[name="level"]');
        console.log(firstRadioButton);
        
        const allSkill = document.querySelectorAll('input[name="skills"]');
        allSkill.forEach(element => {
            console.log(element.value);
        });
        
        //3.1
        btnPreview.onclick = function() {
            alert('กำลังประมวลผล...');
        }

        const departmentSelect = document.getElementById('department');
        departmentSelect.onchange = function(event) {
            console.log('แผนกที่เลือก: ', event.target.value);
        }

        const fullnameInput = document.getElementById('fullname');
        const nameError = document.getElementById('nameError');
        fullnameInput.onkeyup = function() {
            const textValue = fullnameInput.value;
            if (textValue.length < 3) {
                nameError.textContent = 'ชื่อต้องยาวอย่างน้อย 3 ตัวอักษร';
            }
            else {
                nameError.textContent = '';
            }
        };

        const previewCard = document.getElementById('previewCard');
        previewCard.onmouseover = function() {
            previewCard.style.backgroundColor = '#e0f7fa';
        };
        previewCard.onmouseout = function() {
            previewCard.style.backgroundColor = '';
        };

        //3.2
        const regForm = document.getElementById('regForm');
        regForm.addEventListener('submit', function(event) {
            event.preventDefault(); // ยับยั้ง Refresh หน้าจอของ Form
            console.log("Event Type:", event.type);
            console.log("Target Element:", event.target);
        });

        //4.1
        const dispName = document.getElementById('dispName');
        fullnameInput.onkeyup = function() {
            const textValue = fullnameInput.value;
            // dispName.textContent = 'ชื่อ: ' + textValue;
            // dispName.innerText = 'ชื่อ: ' + textValue;
            dispName.innerHTML = 'ชื่อ: ' + textValue;
        };
        
        const dispDetails = document.getElementById('dispDetails');
        function updateSkill(arraySkill) {
            if (arraySkill.length == 0) {
                dispDetails.innerHTML = 'ไม่ได้เลือกทักษะ';
                return;
            }

            let htmlContent = 'รายละเอียดทักษะ: <ul>';
            arraySkill.forEach(function(skill) {
                htmlContent += `<li>${skill}</li>`;
            });
            htmlContent += `</ul>`;
            dispDetails.innerHTML = htmlContent;
        }
        const checkboxSkill = document.querySelectorAll('input[name="skills"]');
        function handleSkillChange() {
            const selectedSkill = [];
            checkboxSkill.forEach(function(checkbox) {
                if (checkbox.checked) {
                    selectedSkill.push(checkbox.value);
                }
            });
            updateSkill(selectedSkill);
        }
        checkboxSkill.forEach(function(checkbox) {
            checkbox.addEventListener('change', handleSkillChange);
        });
        handleSkillChange();

        //4.2
        const avatarUrlInput = document.getElementById('avatarUrl');
        const avaterImg = document.getElementById('avatarImg');
        avatarUrlInput.addEventListener('input', function(){
            const newUrl = avatarUrlInput.value;
            const oldUrl = avaterImg.getAttribute('src');
            console.log('oldUrl: ', oldUrl);
            if (newUrl.trim() != '') {
                avaterImg.setAttribute('src', newUrl);
            }
            else{
                avaterImg.setAttribute('src', oldUrl);
            }
        });
    </script>
</body >

</html >
